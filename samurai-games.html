<title>SamurAi Games</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky indigo nav, an aizome-patterned masthead on the Games view, then a filterable card grid.
   Views swap in place by hash: #games, #creators, #you, #by-<handle>. */
:root{
  --bg:#e8edf3; --surface:#f8fafc; --ink:#13213a; --muted:#56647a; --line:#cbd5e1;
  --indigo:#1c3961; --indigo-deep:#0f1f38; --on-indigo:#eef2f8; --on-indigo-muted:#a9b8d0;
  --gold:#94690f; --gold-soft:#f2e6c6; --seal:#b3322a; --ok:#2f7a4f;
  --display:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1422; --surface:#122037; --ink:#e3e9f2; --muted:#94a2b9; --line:#25364f;
  --indigo:#183259; --indigo-deep:#070f1c; --on-indigo:#eef2f8; --on-indigo-muted:#a3b2ca;
  --gold:#d9b45c; --gold-soft:#372d15; --seal:#e15b50; --ok:#5fbf86; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1422; --surface:#122037; --ink:#e3e9f2; --muted:#94a2b9; --line:#25364f;
  --indigo:#183259; --indigo-deep:#070f1c; --on-indigo:#eef2f8; --on-indigo-muted:#a3b2ca;
  --gold:#d9b45c; --gold-soft:#372d15; --seal:#e15b50; --ok:#5fbf86; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--indigo-deep)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--indigo-deep);color:var(--on-indigo)}
.nav .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand .mark{width:30px;height:30px;border-radius:4px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:15px}
.brand b{font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.01em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{padding:6px 12px;border-radius:4px;text-decoration:none;color:var(--on-indigo-muted);font-weight:500}
.tabs a:hover{color:var(--on-indigo);background:rgba(255,255,255,.06)}
.tabs a[aria-current="page"]{color:var(--on-indigo);background:rgba(255,255,255,.12)}

/* masthead: seigaiha wave pattern over aizome indigo */
.wave{background-color:var(--indigo);
  background-image:
    radial-gradient(circle at 50% 100%, transparent 0 18%, rgba(255,255,255,.07) 18% 23%, transparent 23% 38%, rgba(255,255,255,.07) 38% 43%, transparent 43% 58%, rgba(255,255,255,.07) 58% 63%, transparent 63%),
    radial-gradient(circle at 50% 100%, transparent 0 18%, rgba(255,255,255,.07) 18% 23%, transparent 23% 38%, rgba(255,255,255,.07) 38% 43%, transparent 43% 58%, rgba(255,255,255,.07) 58% 63%, transparent 63%);
  background-size:56px 28px;background-position:0 0,28px 14px}
.mast{color:var(--on-indigo)}
.mast .wrap{padding-block:44px 36px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.mast h1{font-size:clamp(34px,6vw,62px);letter-spacing:-.01em}
.mast h1 em{font-style:normal;color:var(--gold-soft)}
:root .mast h1 em{color:#f2d68c}
.mast p{max-width:56ch;margin:12px 0 0;color:var(--on-indigo-muted);font-size:16px}
.stats{display:flex;gap:22px;margin-top:20px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats strong{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--on-indigo)}
.stats span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-indigo-muted)}
@media (max-width:640px){.mast .wrap{grid-template-columns:minmax(0,1fr)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:4px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
:root .btn.primary{color:var(--bg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.onink{background:#f2d68c;border-color:#f2d68c;color:#1a1405}
.btn.ghost{background:transparent}
.btn.danger{color:var(--seal);border-color:color-mix(in srgb,var(--seal) 45%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;text-align:left;color:inherit}

/* toolbar */
main{padding-block:28px 64px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 12px}
.search input{border:0;background:transparent;padding:9px 0;width:100%;min-width:0;outline:none}
.search:focus-within{border-color:var(--gold)}
select{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 6px}

/* section heads */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 0 14px;flex-wrap:wrap}
.sec h2{font-size:22px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--muted)}
.cover{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;color:#fff;display:block;width:100%;border:0;padding:0;cursor:pointer;text-align:left}
.cover .art{position:absolute;inset:0;background-size:40px 20px,40px 20px,auto;background-position:0 0,20px 10px,0 0}
.cover .glyph{position:absolute;right:12px;bottom:4px;font-family:var(--display);font-size:72px;line-height:1;opacity:.9;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.seal{position:absolute;top:10px;left:10px;background:var(--seal);color:#fff;font-family:var(--display);font-size:12px;padding:3px 7px;border-radius:3px;letter-spacing:.04em;z-index:1}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.card h3{font-size:17px;letter-spacing:.01em;overflow-wrap:anywhere}
.card .tagline{color:var(--muted);margin:0;font-size:14px;overflow-wrap:anywhere}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}
.card .foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.by{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;font-weight:500}
.by span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;width:24px;height:24px;border-radius:4px;position:relative;overflow:hidden;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:11px}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.lg{width:88px;height:88px;font-size:36px;border-radius:8px}
.av.md{width:52px;height:52px;font-size:22px;border-radius:6px}
.featured .grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
@media (max-width:420px){.featured .grid{grid-template-columns:minmax(0,1fr)}}

/* creators */
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:flex-start;text-decoration:none;min-width:0}
.ccard:hover{border-color:var(--muted)}
.ccard .txt{min-width:0;display:flex;flex-direction:column;gap:4px}
.ccard h3{font-size:16px;overflow-wrap:anywhere}
.ccard p{margin:0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}

/* profile page */
.phead{color:var(--on-indigo)}
.phead .wrap{padding-block:32px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.phead .txt{min-width:0;flex:1 1 300px}
.phead h1{font-size:clamp(28px,4.5vw,44px);overflow-wrap:anywhere}
.phead p{margin:8px 0 0;color:var(--on-indigo-muted);max-width:62ch;white-space:pre-wrap;overflow-wrap:anywhere}
.phead .kind{color:#f2d68c}
.phead a.site{color:#f2d68c;font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}

/* forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.panel h2{font-size:20px;margin-bottom:4px}
.panel .sub{color:var(--muted);margin:0 0 18px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form .full{grid-column:1/-1}
@media (max-width:640px){.form{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-weight:700;font-size:13px}
.field small{color:var(--muted);font-size:12px}
.field input[type=text],.field input[type=url],.field textarea,.field select{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold);outline:none}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer;background:var(--bg)}
.seg label:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.uprow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.thumbprev{width:160px;max-width:100%;aspect-ratio:16/10;border-radius:4px;overflow:hidden;position:relative;color:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:24px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.mine{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:10px;background:var(--bg);min-width:0}
.mrow .thumbprev{width:88px;flex:none}
.mrow .txt{min-width:0;flex:1}
.mrow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .tagline{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* states */
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:10px 14px;margin-bottom:18px;font-size:14px;color:var(--muted)}
.notice b{color:var(--ink)}

/* modal */
.overlay[hidden],.toast[hidden]{display:none!important}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(5,10,20,.6);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:8px;max-width:720px;width:100%;max-height:100%;overflow:auto;border:1px solid var(--line)}
.modal .cover{cursor:default;aspect-ratio:16/8}
.modal .mb{padding:20px 22px 22px;display:flex;flex-direction:column;gap:12px}
.modal h2{font-size:26px;overflow-wrap:anywhere}
.modal .desc{white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts b{font-size:14px}
.close{position:absolute;top:10px;right:10px;z-index:2;background:rgba(0,0,0,.45);color:#fff;border:0;width:34px;height:34px;border-radius:4px;cursor:pointer;font-size:18px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-weight:500;max-width:calc(100% - 32px)}
.toast.bad{background:var(--seal);color:#fff}
@media (prefers-reduced-motion:no-preference){.card,.ccard{transition:border-color .15s}.cover img{transition:transform .3s}.card:hover .cover img{transform:scale(1.03)}}
</style>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="#games"><span class="mark" aria-hidden="true">侍</span><b>SamurAi Games</b></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#games" data-view="games">Games</a>
      <a href="#creators" data-view="creators">Creators</a>
      <a href="#you" data-view="you">Your profile</a>
    </nav>
  </div>
</header>
<div id="app"></div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
const GENRES = ["Action","Arcade","Puzzle","Strategy","RPG","Platformer","Racing","Rhythm","Word","Card & board","Simulation","Idle","Narrative","Other"];
const CONTROLS = ["Keyboard","Mouse","Touch","Gamepad"];
const LENGTHS = ["Under 5 min","5–15 min","15–60 min","Hours","Endless"];

const S = {
  db:null, user:null, assets:null, uid:null, myName:"", canWrite:null, canMod:false,
  ready:false, unavailable:false, stale:false,
  creators:new Map(), featured:[],
  q:"", genre:"All", sort:"new", ckind:"all",
  view:"games", handle:null,
  edit:null,      // game being edited in the You view: null | {…draft}
  profDraft:null, // profile draft while editing
  dirty:false, modal:null, confirmKey:null
};

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(String(k)));
  return el;
}
function hash(str){ let x = 2166136261; for (const c of String(str)) { x ^= c.codePointAt(0); x = Math.imul(x, 16777619); } return x >>> 0; }
function safeUrl(u){ try { const x = new URL(String(u||"").trim()); return x.protocol === "https:" ? x.href : null; } catch { return null; } }
function slug(s){ return String(s||"").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,32); }
function initial(s){ const t = String(s||"?").trim(); return (t[0] || "?").toUpperCase(); }
function ago(ts){
  if (!ts) return "";
  const d = (Date.now() - ts)/1000;
  if (d < 3600) return Math.max(1, Math.round(d/60)) + " min ago";
  if (d < 86400) return Math.round(d/3600) + " h ago";
  if (d < 86400*30) return Math.round(d/86400) + " d ago";
  return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function hostOf(u){ try { return new URL(u).host.replace(/^www\./,""); } catch { return ""; } }
function newId(){ return "g" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let toastT;
function toast(msg, bad){ const t = $("#toast"); t.textContent = msg; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* generated covers: seigaiha waves on a hue taken from the title */
function artStyle(seed){
  const hue = hash(seed) % 360;
  const a = `hsl(${hue} 48% 30%)`, b = `hsl(${(hue+38)%360} 52% 18%)`;
  const ring = "rgba(255,255,255,.13)";
  const w = `radial-gradient(circle at 50% 100%, transparent 0 18%, ${ring} 18% 24%, transparent 24% 38%, ${ring} 38% 44%, transparent 44% 58%, ${ring} 58% 64%, transparent 64%)`;
  return `background-image:${w},${w},linear-gradient(135deg, ${a}, ${b})`;
}
function cover(game, ownerUid, opts={}){
  const el = h(opts.tag || "div", Object.assign({class:"cover"}, opts.attrs || {}));
  el.append(h("div",{class:"art", style:artStyle(ownerUid + game.title)}), h("div",{class:"glyph","aria-hidden":"true", text:initial(game.title)}));
  if (game.thumb) {
    const img = h("img",{src:"/_blob/" + game.thumb, alt:"", loading:"lazy"});
    img.addEventListener("error", () => img.remove());
    el.append(img);
  }
  if (opts.seal) el.append(h("span",{class:"seal", text:"選 Featured"}));
  return el;
}
function avatar(c, size){
  const el = h("span",{class:"av" + (size ? " " + size : ""), style:`background:hsl(${hash(c.uid) % 360} 42% 34%)`, "aria-hidden":"true", text:initial(c.name)});
  if (c.avatar) { const img = h("img",{src:"/_blob/" + c.avatar, alt:""}); img.addEventListener("error", () => img.remove()); el.append(img); }
  return el;
}

/* ---------- data ---------- */
function allGames(){
  const out = [];
  for (const c of S.creators.values()) for (const g of (c.games || [])) if (g && g.id && g.title && safeUrl(g.url)) out.push({g, c, key: c.uid + "~" + g.id});
  return out;
}
const me = () => S.uid ? S.creators.get(S.uid) : null;
function byHandle(hd){ for (const c of S.creators.values()) if (c.handle === hd) return c; return null; }

let wq = Promise.resolve();
function write(fn){ const p = wq.then(fn); wq = p.catch(() => {}); return p; }
function writeError(e){
  const code = e && e.code;
  if (code === "invalid_argument") { S.canWrite = false; toast("You can browse here, but your access level can't post. Ask the owner for Contributor access.", true); }
  else if (code === "quota_exceeded") toast("The arcade is out of storage space. Remove an old game and try again.", true);
  else if (code === "resource_exhausted") toast("Too many changes at once. Wait a moment and try again.", true);
  else toast("Couldn't save. Check your connection and try again.", true);
}
async function saveMine(patch){
  const ref = S.db.doc("creators/" + S.uid);
  const cur = me();
  const now = Date.now();
  if (!cur) await write(() => ref.set(Object.assign({games:[], createdAt:now}, patch, {updatedAt:now})));
  else await write(() => ref.update(Object.assign({}, patch, {updatedAt:now})));
}
async function saveGamesOf(uid, games){
  await write(() => S.db.doc("creators/" + uid).update({games, updatedAt:Date.now()}));
}

/* ---------- routing ---------- */
function route(){
  const raw = (location.hash || "").replace(/^#/, "");
  if (raw.startsWith("by-")) { S.view = "profile"; S.handle = raw.slice(3); }
  else if (raw === "creators" || raw === "you") { S.view = raw; S.handle = null; }
  else { S.view = "games"; S.handle = null; }
  document.querySelectorAll(".tabs a").forEach(a => { if (a.dataset.view === S.view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  render(true);
  window.scrollTo(0,0);
}

/* ---------- render ---------- */
function render(force){
  // keep forms stable while someone is typing in them
  if (!force && S.view === "you" && S.dirty) return;

      genre:GENRES.includes(d.genre) ? d.genre : "Other", controls:(d.controls||[]).filter(c => CONTROLS.includes(c)), length:LENGTHS.includes(d.length) ? d.length : "",
      builtWith:(d.builtWith||"").trim().slice(0,60), thumb:d.thumb || null, createdAt:(original && original.createdAt) || Date.now(), updatedAt:Date.now()};
    const list = (me().games||[]).filter(g => g.id !== game.id);
    try {
      await saveGamesOf(S.uid, [game, ...list]);
      if (original && original.thumb && original.thumb !== game.thumb && S.assets) S.assets.delete(original.thumb).catch(() => {});
      toast(d.id ? "Game updated" : "Game posted"); done();
    } catch(e2){ writeError(e2); save.disabled = false; save.textContent = d.id ? "Save changes" : "Post game"; }
  }},
    field("Title", title),
    field("Play link", url, "Where people play it. A published Claude artifact link works well."),
    field("Tagline", tagline, "One line for the card.", true),
    field("Description", desc, null, true),
    field("Genre", genre),
    field("Session length", length),
    h("div",{class:"field full"}, h("span",{text:"Controls"}), controls),
    field("Built with", built, "Optional, e.g. the Claude tools you used."),
    h("div",{class:"field"}, h("span",{text:"Cover image"}), uploader(d.thumb, id => d.thumb = id, "thumb", id => cover({title:d.title || "Game", thumb:id}, S.uid))),
    h("div",{class:"full"}, err, h("div",{class:"actions"}, save,
      h("button",{class:"btn ghost", type:"button", onclick:done, text:"Cancel"}),
      d.id ? modControl("mine:" + d.id, "Delete game", async () => {
        try { await saveGamesOf(S.uid, (me().games||[]).filter(g => g.id !== d.id)); if (original && original.thumb && S.assets) S.assets.delete(original.thumb).catch(() => {}); toast("Game deleted"); done(); } catch(e2){ writeError(e2); }
      }) : null)));
  return h("div",{class:"panel"}, h("h2",{text: d.id ? "Edit game" : "Post a game"}), h("p",{class:"sub", text:"It shows in the arcade grid and on your profile as soon as you save."}), form);
}

/* ---------- boot ---------- */
window.addEventListener("hashchange", route);
route();

(async function boot(){
  const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, user, assets] = await Promise.all([use("db"), use("user"), use("assets")]);
  S.db = db; S.user = user; S.assets = assets;
  if (!db) { S.unavailable = true; render(true); return; }
  if (user) {
    const [mev, cw, mod] = await Promise.all([user.me(), user.can("data.write"), user.canEdit()]);
    S.uid = mev.id; S.myName = mev.name || ""; S.canMod = !!mod;
    S.canWrite = cw === null ? null : cw;
  }
  const timer = setTimeout(() => { S.stale = true; render(); }, 10000);
  db.collection("creators").onSnapshot(snap => {
    const m = new Map();
    for (const d of snap.docs) { const v = d.data(); if (v && v.name && v.handle) m.set(d.id, Object.assign({uid:d.id}, v)); }
    S.creators = m;
    if (!snap.metadata.fromCache) { S.ready = true; S.stale = false; clearTimeout(timer); }
    else if (m.size) S.ready = true;
    render();
  }, () => { clearTimeout(timer); S.ready = true; S.unavailable = true; render(true); });
  db.doc("site/config").onSnapshot(snap => {
    const v = snap.exists ? snap.data() : null;
    S.featured = v && Array.isArray(v.featured) ? v.featured.filter(k => typeof k === "string") : [];
    render();
  }, () => {});
})();
})();
</script>
